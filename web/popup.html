<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memoir</title>
  <!-- (Windows: Today is a page in a window, so it names its icon, or the window asks for /favicon.ico) -->
  <link rel="icon" href="icons/icon32.png">
  <script src="desktop-bridge.js"></script>
  <script src="shared/theme-boot.js"></script>
  <link rel="preload" href="fonts/Unbounded-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/logo.css">
  <link rel="stylesheet" href="shared/pop.css">
  <link rel="stylesheet" href="shared/goal.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="top" data-anim style="--i:0">
      <div class="brand">
        <span class="top-mark logo themed hold" aria-hidden="true"><span class="lg-clock"><i class="lg-ring"></i><i class="lg-sec"><i class="lg-knob"></i></i><i class="lg-min"></i><i class="lg-hour"></i></span></span>
        <div>
          <h1><span class="wordmark">Memoir</span></h1>
          <p class="caption" id="today-label"></p>
        </div>
      </div>
      <button class="btn btn-primary btn-xs resume" id="resume" type="button" hidden title="Tracking is paused" aria-label="Tracking is paused. Resume tracking">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 3.6v8.8a.6.6 0 0 0 .9.5l6.9-4.4a.6.6 0 0 0 0-1L6.1 3.1a.6.6 0 0 0-.9.5Z" fill="currentColor"/></svg><span>Resume</span>
      </button>
    </header>

    <section class="card hero" data-anim style="--i:1">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-labelledby="ring-label">
          <circle class="ring-track" cx="60" cy="60" r="50"/>
          <g id="ring-segs" transform="rotate(-90 60 60)"></g>
        </svg>
        <div class="ring-center" id="ring-center">
          <span class="ring-total display num" id="today-total">0m</span>
          <span class="ring-sub" id="ring-sub">today</span>
        </div>
        <p class="sr-only" id="ring-label"></p>
      </div>
      <div class="hero-side">
        <ul class="legend" id="legend"></ul>
        <p class="caption compare" id="compare"></p>
      </div>
    </section>

    <section class="card goal-row" id="goal-row" data-level="none" data-anim style="--i:2" aria-label="Daily limit">
      <div class="goal-mini" id="goal-mini"></div>
      <div class="goal-text">
        <p class="goal-main" id="goal-main">No daily limit</p>
        <p class="goal-sub" id="goal-sub">Get a nudge when you reach it</p>
      </div>
      <div class="goal-action" id="goal-action" data-locked="false">
        <button class="btn btn-primary btn-xs goal-set" id="goal-set" type="button">Set limit</button>
        <span class="goal-lock" id="goal-lock" title="You committed to this limit. Only Settings in the Weekly Report can unlock it.">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5.4a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Locked</span>
        </span>
      </div>
    </section>

    <section class="most" data-anim style="--i:3">
      <div class="most-head">
        <p class="overline">Most used today</p>
        <span class="caption" id="site-count"></span>
      </div>
      <div class="card list-card" id="list-card">
        <ol class="site-list" id="site-list"></ol>
        <div class="empty" id="sites-empty" hidden>
          <p>No activity yet today.</p>
        </div>
      </div>
    </section>

    <p class="week-tip" id="week-tip" data-anim style="--i:4" hidden>Your whole week, day by day, is one click away.</p>
    <button class="btn btn-primary btn-lg week-btn" id="open-week" data-anim style="--i:4">
      <span>Weekly Report</span>
      <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </main>
  <div class="pop" id="cat-pop" role="dialog" aria-label="Sites in this category" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
